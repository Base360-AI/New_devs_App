# Debug overlay - adds a debugpy listener to the backend without changing the base image.
#
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up
#
# Then attach with the VS Code launch config "Python: Attach to Backend (Docker)".
# debugpy is installed at container start, so no image rebuild is required.
services:
  backend:
    ports:
      - "8000:8000"
      - "5678:5678" # debugpy
    command: >
      sh -c "pip install --no-cache-dir debugpy &&
             python -m debugpy --listen 0.0.0.0:5678
             -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
